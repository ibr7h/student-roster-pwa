name: Validate v4.7.1 assessment edit scope
on:
  push:
    paths:
      - '.github/workflows/validate-v471.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate v4.7.1
        run: |
          node --check app.js
          node --check sw.js
          python - <<'PY'
          from pathlib import Path
          import re
          h=Path('index.html').read_text(encoding='utf-8')
          a=Path('app.js').read_text(encoding='utf-8')
          v=Path('version.js').read_text(encoding='utf-8')
          checks={
            'version': "APP_VERSION='4.7.1'" in v and 'v4.7.1' in h,
            'edit repeat ui': 'assessmentRepeatTitle' in h and 'assessmentRepeatDesc' in h,
            'peer classes': 'function assessmentPeerClasses' in a,
            'counterpart lookup': 'function assessmentCounterpartInClass' in a,
            'edit plan': 'function assessmentEditPlan' in a,
            'group linking': 'repeatGroupId' in a and 'repeatSourceClassId' in a,
            'old assessment match': 'assessmentIdentityKey(base)' in a,
            'missing copy creation': "created++" in a and "item.target.assessmentEvents.push(copy)" in a,
            'max score safety': 'highestGradeForAssessment' in a and 'لا يمكن خفض الدرجة' in a,
            'local-only detach': 'delete base.repeatGroupId' in a and 'delete base.repeatSourceClassId' in a,
            'duplicate protection': 'assessmentExistsInClass(item.target,draft,item.assessment.id)' in a,
          }
          bad=[k for k,val in checks.items() if not val]
          if bad: raise SystemExit('failed: '+', '.join(bad))
          print('v4.7.1 assessment edit validation passed')
          PY
