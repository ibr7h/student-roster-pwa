name: Verify Arabic mobile hamburger UX and navigation
on:
  push:
    branches: [test/school-v39-connectivity-menu-regression-r17, fix/school-v39-mobile-hamburger-ux-r16-20261026, fix/iphone-inner-fixed-header-r21, feature/school-v3.9-unified-auth-20261020]
    paths:
      - scripts/mobile-menu-browser-v39.mjs
      - scripts/school-mobile-menu-ux-v39.js
      - scripts/mobile-native-v38.js
      - scripts/school-mobile-menu-ux-v39.css
      - scripts/apply-mobile-menu-ux-v39.mjs
      - scripts/static-frontend-v37.mjs
      - .github/workflows/mobile-menu-ux-v39.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build preview PWA with accessibility menu
        run: |
          unzip -q -o site.zip -d public
          node -e "const fs=require('node:fs'),z=require('node:zlib');fs.writeFileSync('school-backend.tar',z.brotliDecompressSync(Buffer.from(fs.readFileSync('backend-package.b64','utf8').trim(),'base64')))"
          tar -xf school-backend.tar
          node patch-release.mjs
          node scripts/static-frontend-v37.mjs
          node --check public/assets/school-mobile-menu-ux-v39.js
      - name: Install Playwright harness
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright-core@1.58.2
      - name: Check real mobile navigation on Chrome
        run: TEST_BROWSER=chromium node scripts/mobile-menu-browser-v39.mjs
  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: {image: 'mcr.microsoft.com/playwright:v1.58.2-noble'}
    steps:
      - uses: actions/checkout@v4
      - name: Install unzip
        run: apt-get update -qq && apt-get install -y -qq unzip
      - name: Build PWA in WebKit runner
        run: |
          unzip -q -o site.zip -d public
          node -e "const fs=require('node:fs'),z=require('node:zlib');fs.writeFileSync('school-backend.tar',z.brotliDecompressSync(Buffer.from(fs.readFileSync('backend-package.b64','utf8').trim(),'base64')))"
          tar -xf school-backend.tar
          node patch-release.mjs
          node scripts/static-frontend-v37.mjs
          node --check public/assets/school-mobile-menu-ux-v39.js
      - name: Install Playwright harness
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright-core@1.58.2
      - name: Check real mobile navigation on WebKit
        run: node scripts/mobile-menu-browser-v39.mjs
