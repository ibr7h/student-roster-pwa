name: Upgrade V3.3 class report and mobile layout

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply V3.3 upgrade
        run: |
          python scripts/upgrade-v33.py
          node --check app.js
          node --check sw.js
          grep -q "classOfficialSheet" app.js
          grep -q "ترتيبه أبجديًا" app.js
          grep -q "V3.3 mobile width" styles.css
          grep -q "student-roster-pwa-v3.3" sw.js
      - name: Commit V3.3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add formal class sheet, alphabetical transfers, and mobile assessment fit"
          git push
