name: Fix obsolete school cloud warning
on:
  push:
    branches:
      - deploy/school-evidence-v3.3-neon-mobile-20261019
    paths:
      - scripts/fix-cloud-banner.mjs
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Patch cloud PWA warning and verify existing backend tests
        run: node scripts/fix-cloud-banner.mjs
      - name: Push verified backend package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend-package.b64
          git diff --cached --quiet && exit 0
          git commit -m "Fix obsolete local-storage warning in cloud PWA v3.3.2"
          git push
