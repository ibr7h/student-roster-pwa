name: Verify static API integration v3.7
on:
  push:
    branches:
      - preview/school-evidence-static-v37-20261020
    paths:
      - scripts/apply-static-api-v37.mjs
      - .github/workflows/verify-static-api-v37.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Ensure PDF tools used by existing test suite
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ghostscript
      - name: Patch backend and test
        run: node scripts/apply-static-api-v37.mjs
      - name: Commit verified preview archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend-package.b64
          git diff --cached --quiet && exit 0
          git commit -m "Validate static API session bridge v3.7"
          git push
