name: Validate V4 clean UI
on:
  push:
    paths:
      - '.github/workflows/validate-v4.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate V4 structure
        run: |
          node --check app.js
          node --check sw.js
          python - <<'PY'
          from pathlib import Path
          import re
          h=Path('index.html').read_text(encoding='utf-8')
          a=Path('app.js').read_text(encoding='utf-8')
          s=Path('styles.css').read_text(encoding='utf-8')
          p=Path('print.css').read_text(encoding='utf-8')
          v=Path('version.js').read_text(encoding='utf-8')
          ids=re.findall(r'\bid="([^"]+)"',h)
          dup=sorted({x for x in ids if ids.count(x)>1})
          if dup: raise SystemExit('duplicate ids: '+','.join(dup))
          checks={
            'version 4.0.0': "APP_VERSION='4.0.0'" in v and 'v4.0.0' in h,
            'no legacy print blocks': '@media print' not in s,
            'single canonical print block': len(re.findall(r'@media\s+print',p))==1,
            'three report panels': all(f'data-report-panel="{x}"' in h for x in ['class','attendance','students']),
            'three report tabs': all(f'data-report-tab="{x}"' in h for x in ['class','attendance','students']),
            'attendance print in reports': "showView('reports',false)" in a and "setReportTab('attendance',false)" in a,
            'class landscape': "function printClassReport(){setReportTab('class',false);setPrintPage('landscape')" in a,
            'attendance landscape': "function printAttendanceReport(){setReportTab('attendance',false);setPrintPage('landscape')" in a,
            'planned sessions': 'function plannedAttendanceSessions' in a,
            'print css cached': "'./print.css'" in Path('sw.js').read_text(encoding='utf-8'),
          }
          bad=[k for k,val in checks.items() if not val]
          if bad: raise SystemExit('failed: '+', '.join(bad))
          print('V4 validation passed')
          PY
