name: Inspect operational plan logo
on:
  push:
    paths:
      - '.github/workflows/inspect-op-logo.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect embedded images
        shell: bash
        run: |
          python - <<'PY'
          import re, base64, urllib.request, struct
          url='https://raw.githubusercontent.com/ibr7h/-1-/main/operational-plan-pwa/index.html'
          data=urllib.request.urlopen(url, timeout=30).read().decode('utf-8','ignore')
          pat=re.compile(r'data:image/(png|jpeg|jpg|webp);base64,([A-Za-z0-9+/=]+)')
          matches=list(pat.finditer(data))
          print('COUNT',len(matches))
          for i,m in enumerate(matches):
              raw=base64.b64decode(m.group(2))
              mime=m.group(1)
              dims=''
              if raw.startswith(b'\x89PNG') and len(raw)>=24:
                  w,h=struct.unpack('>II',raw[16:24]); dims=f'{w}x{h}'
              ctx=data[max(0,m.start()-500):m.start()]
              ctx=re.sub(r'\s+',' ',ctx)[-500:]
              print(f'IMAGE {i} mime={mime} bytes={len(raw)} dims={dims}')
              print('CTX',ctx)
          PY
