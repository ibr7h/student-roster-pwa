name: Validate v4.10 fast schedule entry
on:
  push:
    paths:
      - '.github/workflows/validate-v410.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate v4.10
        run: |
          node --check app.js
          node --check sw.js
          python - <<'PY'
          from pathlib import Path
          import re
          h=Path('index.html').read_text(encoding='utf-8')
          a=Path('app.js').read_text(encoding='utf-8')
          v=Path('version.js').read_text(encoding='utf-8')
          ids=re.findall(r'\bid="([^"]+)"',h)
          dup=sorted({x for x in ids if ids.count(x)>1})
          if dup: raise SystemExit('duplicate ids: '+','.join(dup))
          checks={
            'version': "APP_VERSION='4.10.0'" in v and 'v4.10.0' in h,
            'entry ui': all(x in h for x in ['scheduleSubjectTabs','scheduleClassSelect','scheduleSaveDistributionBtn','scheduleNextClassBtn','scheduleSingleEditBtn']),
            'subject grouping': 'function scheduleTeachingSubjects' in a and 'function scheduleClassesForSubject' in a,
            'context selection': 'function syncScheduleEntryContext' in a,
            'conflict detection': 'function scheduleEntryConflict' in a and "الحصة مشغولة بـ" in a,
            'multi-select': 'scheduleEntrySelected=new Set' in a and 'function handleScheduleCellClick' in a,
            'bulk save': 'function saveScheduleDistribution' in a and "for(const key of selected)" in a,
            'next class': 'function nextScheduleEntryClass' in a,
            'single edit': "scheduleEntryMode==='distribution'?'single':'distribution'" in a,
            'class id persistence': "classId:c.id" in a,
            'reports refresh': 'renderSchedule();renderReports();queueSave()' in a,
          }
          bad=[k for k,val in checks.items() if not val]
          if bad: raise SystemExit('failed: '+', '.join(bad))
          print('v4.10 fast schedule entry validation passed')
          PY
