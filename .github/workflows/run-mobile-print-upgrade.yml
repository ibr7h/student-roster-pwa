name: Run mobile and A4 report upgrade

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply upgrade
        run: python tools/upgrade_mobile_print.py
      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check sw.js
          grep -q "officialReportHeader" app.js
          grep -q "V3.2 mobile assessment" styles.css
      - name: Remove one-time upgrade files
        run: rm -f tools/upgrade_mobile_print.py .github/workflows/run-mobile-print-upgrade.yml
      - name: Commit upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve mobile assessment modal and official A4 reports"
          git push
