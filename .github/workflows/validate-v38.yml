name: Validate V3.8 attendance reports
on:
  push:
    paths:
      - '.github/workflows/validate-v38.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate application
        run: |
          node --check app.js
          node --check sw.js
          python - <<'PY'
          from pathlib import Path
          h=Path('index.html').read_text(encoding='utf-8')
          a=Path('app.js').read_text(encoding='utf-8')
          c=Path('styles.css').read_text(encoding='utf-8')
          checks=[
            ('attendanceReportPeriod',h),
            ('attendanceReportPreview',h),
            ('printAttendanceReportBtn',h),
            ('function attendanceRegisterSheet',a),
            ("$$('[data-attendance]')",a),
            ("print-attendance-report",a),
            ('V3.8 attendance register + A4 fit',c),
            ('width:277mm',c),
            ('width:190mm',c),
          ]
          missing=[x for x,t in checks if x not in t]
          if missing: raise SystemExit('missing: '+', '.join(missing))
          print('V3.8 validation passed')
          PY
