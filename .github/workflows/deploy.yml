# V2 preview source: 5.0.0-dev.7
name: Deploy Student Records PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: student-roster-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout stable main
        uses: actions/checkout@v6

      - name: Validate stable source
        run: node scripts/validate.cjs

      - name: Checkout V2 preview
        uses: actions/checkout@v6
        with:
          ref: behavior-forms-v2
          path: v2-source

      - name: Validate V2 source
        working-directory: v2-source
        run: node scripts/validate.cjs

      - name: Build Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site/v2-preview
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_site' \
            --exclude='v2-source' \
            ./ _site/
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            v2-source/ _site/v2-preview/
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
