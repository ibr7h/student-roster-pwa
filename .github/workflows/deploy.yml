name: Deploy Student Records PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Expand V3 source bundle
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G ".bootstrap/site.part.*" > /dev/null; then
            cat .bootstrap/site.part.* > /tmp/site.b64
            base64 -d /tmp/site.b64 > /tmp/site.tar.xz
            tar -xJf /tmp/site.tar.xz -C .
            rm -rf .bootstrap
          fi

      - name: Commit expanded source
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Expand Student Records PWA V3 source"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Pages source enabled; this touch triggers a fresh deployment from the latest main branch.
