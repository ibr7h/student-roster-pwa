name: Validate v4.10.1 mobile schedule selection
on:
  push:
    paths:
      - '.github/workflows/validate-v4101.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate v4.10.1
        run: |
          node --check app.js
          node --check sw.js
          python - <<'PY'
          from pathlib import Path
          import re
          a=Path('app.js').read_text(encoding='utf-8')
          h=Path('index.html').read_text(encoding='utf-8')
          v=Path('version.js').read_text(encoding='utf-8')
          assert "APP_VERSION='4.10.1'" in v
          assert 'v4.10.1' in h
          assert "$$('[data-schedule-subject]').forEach" in a
          assert "$$('[data-schedule-slot]').forEach" in a
          assert "syncScheduleEntryContext();\n  renderScheduleLibrary();" in a
          assert "function handleScheduleCellClick" in a
          assert "scheduleEntrySelected.has(key)" in a
          ids=re.findall(r'\bid="([^"]+)"',h)
          dup=sorted({x for x in ids if ids.count(x)>1})
          assert not dup, 'duplicate ids: '+','.join(dup)
          print('v4.10.1 mobile schedule selection validation passed')
          PY
