name: Validate v4.4 attendance diagnostics
on:
  push:
    paths:
      - '.github/workflows/validate-v44.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate v4.4
        run: |
          node --check app.js
          node --check sw.js
          python - <<'PY'
          from pathlib import Path
          import re
          h=Path('index.html').read_text(encoding='utf-8')
          a=Path('app.js').read_text(encoding='utf-8')
          v=Path('version.js').read_text(encoding='utf-8')
          ids=re.findall(r'\bid="([^"]+)"',h)
          dup=sorted({x for x in ids if ids.count(x)>1})
          if dup: raise SystemExit('duplicate ids: '+','.join(dup))
          checks={
            'version': "APP_VERSION='4.4.0'" in v and 'v4.4.0' in h,
            'diagnostic ui': all(x in h for x in ['dbDiagnosticBtn','attendanceReferenceCsvBtn','attendanceDiagnosticClass','dbDiagnosticRows']),
            'reference input': 'attendanceReferenceCsvInput' in h,
            'raw indexed state': "attendanceDiagnosticDbState=await db.getIndexed('state')" in a,
            'db catalog': 'function inspectCurrentOriginDatabases' in a and "indexedDB.databases" in a,
            'store keys': 'function idbStoreKeys' in a,
            'csv parser': 'function parseAttendanceReferenceCsv' in a,
            'filename cutoff': 'function referenceDateFromFilename' in a,
            'class matching': 'function bestClassForAttendanceReference' in a,
            'comparison': 'function attendanceDiagnosticComparison' in a,
            'read-only scan': 'function runAttendanceDatabaseDiagnostic' in a,
            'no writes in diagnostic function': "await db.set('state'" not in a[a.index('async function runAttendanceDatabaseDiagnostic'):a.index('function renderAttendanceReferenceSummary')],
          }
          bad=[k for k,val in checks.items() if not val]
          if bad: raise SystemExit('failed: '+', '.join(bad))
          print('v4.4 attendance diagnostics validation passed')
          PY
