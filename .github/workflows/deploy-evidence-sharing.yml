name: Deploy protected evidence sharing
on:
  push:
    branches:
      - deploy/school-evidence-v3.3-neon-mobile-20261019
    paths:
      - scripts/share-patch.part3
permissions:
  contents: write
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Assemble reviewed evidence patch
        run: |
          node -e "const fs=require('node:fs'),z=require('node:zlib');const b=[1,2,3].map(n=>fs.readFileSync('scripts/share-patch.part'+n,'utf8').trim()).join('');fs.writeFileSync('.apply-evidence-sharing.mjs',z.brotliDecompressSync(Buffer.from(b,'base64')))"
          node --check .apply-evidence-sharing.mjs
      - name: Apply patch and run all backend tests
        run: node .apply-evidence-sharing.mjs
      - name: Commit tested backend package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend-package.b64
          git diff --cached --quiet && exit 0
          git commit -m "Release v3.4 protected evidence QR and reviewer shares"
          git push
