name: Validate v4.7 assessment repeat
on:
  push:
    paths:
      - '.github/workflows/validate-v47.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate v4.7 assessment repeat
        run: |
          node --check app.js
          node --check sw.js
          python - <<'PY'
          from pathlib import Path
          import re
          h=Path('index.html').read_text(encoding='utf-8')
          a=Path('app.js').read_text(encoding='utf-8')
          v=Path('version.js').read_text(encoding='utf-8')
          ids=re.findall(r'\bid="([^"]+)"',h)
          dup=sorted({x for x in ids if ids.count(x)>1})
          if dup: raise SystemExit('duplicate ids: '+','.join(dup))
          checks={
            'version': "APP_VERSION='4.7.0'" in v and 'v4.7.0' in h,
            'toggle ui': 'assessmentRepeatToggle' in h and 'assessmentRepeatInfo' in h,
            'peer matching': 'function assessmentPeerClasses' in a,
            'grade subject matching': 'assessmentAcademicKey(c.grade)' in a and 'assessmentAcademicKey(c.subject)' in a,
            'optional repeat': "const repeat=!!$('#assessmentRepeatToggle')?.checked" in a,
            'edit isolated': "if(editingAssessmentId)" in a and "Object.assign(a,{title,type,date,maxScore,note,legacy:false})" in a,
            'duplicate guard': 'function assessmentExistsInClass' in a,
            'group metadata': 'repeatGroupId' in a and 'repeatSourceClassId' in a,
            'repeat default': "toggle.checked=!a" in a,
            'toggle binding': "$('#assessmentRepeatToggle').onchange=renderAssessmentRepeatInfo" in a,
          }
          bad=[k for k,val in checks.items() if not val]
          if bad: raise SystemExit('failed: '+', '.join(bad))
          print('v4.7 assessment repeat validation passed')
          PY
