name: Validate v4.8 quick grading
on:
  push:
    paths:
      - '.github/workflows/validate-v48.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate v4.8 assessment workflow
        run: |
          node --check app.js
          node --check sw.js
          python - <<'PY'
          from pathlib import Path
          import re
          h=Path('index.html').read_text(encoding='utf-8')
          a=Path('app.js').read_text(encoding='utf-8')
          c=Path('styles.css').read_text(encoding='utf-8')
          v=Path('version.js').read_text(encoding='utf-8')
          ids=re.findall(r'\bid="([^"]+)"',h)
          dup=sorted({x for x in ids if ids.count(x)>1})
          if dup: raise SystemExit('duplicate ids: '+','.join(dup))
          checks={
            'version': "APP_VERSION='4.8.0'" in v and 'v4.8.0' in h,
            'quick panel': all(x in h for x in ['quickGradePanel','bulkOnlyEmpty','bulkGradeButtons','assessmentAutosaveStatus']),
            'mobile cards': 'mobileGradeCards' in h and 'function mobileGradeCard' in a,
            'quick values': 'function quickGradeValues' in a,
            'single grade': 'function setAssessmentGrade' in a,
            'bulk grade': 'function applyBulkAssessmentGrade' in a,
            'safe bulk overwrite': 'سيتم استبدال درجات' in a,
            'autosave': "ae.textContent='✓ محفوظ تلقائيًا'" in a,
            'peer nav': 'function renderAssessmentPeerNav' in a and 'function openAssessmentPeer' in a,
            'repeat edit': 'تطبيق التعديل على الفصول المناظرة' in a and 'function assessmentEditPlan' in a,
            'max score safety all peers': 'highestGradeForAssessment(item.target,item.assessment)' in a,
            'mobile css': '.mobile-grade-card' in c and '.desktop-gradebook{display:none!important}' in c,
            'no bad selector loops': not bool(re.search(r'(?<!\$)\$\([^\n;]*\)\.forEach',a)),
          }
          bad=[k for k,val in checks.items() if not val]
          if bad: raise SystemExit('failed: '+', '.join(bad))
          print('v4.8 quick grading validation passed')
          PY
