name: Upgrade class-aware CSV import

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply tested upgrade
        run: |
          python tools/upgrade_import.py
          node --check app.js
          node --check sw.js
          rm -f tools/upgrade_import.py .github/workflows/upgrade-import.yml
      - name: Commit upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Support class-aware school roster CSV import"
          git push
