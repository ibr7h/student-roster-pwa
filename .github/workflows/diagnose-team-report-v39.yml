name: Diagnose school team and A4 mobile (isolated branch)
on:
  push:
    branches: [fix/school-v39-members-mobile-report-20261026]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assemble preview without production data
        run: |
          unzip -q -o site.zip -d public
          node -e "const fs=require('node:fs'),z=require('node:zlib');fs.writeFileSync('school-backend.tar',z.brotliDecompressSync(Buffer.from(fs.readFileSync('backend-package.b64','utf8').trim(),'base64')))"
          tar -xf school-backend.tar
          node patch-release.mjs
          node scripts/static-frontend-v37.mjs
          node scripts/fix-members-mobile-report-v39.mjs
      - name: Check mobile and member output markers
        run: |
          grep -Fq 'window.schoolMemberSaving' public/index.html
          grep -Fq 'window.schoolPermissionsSaving' public/index.html
          grep -Fq 'mobile-report-fix-v39.css' public/index.html
          test -s public/assets/mobile-report-fix-v39.css
      - name: Install WebKit for member and A4 regression
        run: |
          npm install --no-audit --no-fund --no-save playwright-core@1.58.2
          npx playwright-core install --with-deps webkit
      - name: Test member creation, scoped permissions and A4 phone presentation
        run: node scripts/members-report-browser-v39.mjs
      - name: Print source-only team and report diagnostics
        run: node scripts/diagnose-team-report-v39.mjs
