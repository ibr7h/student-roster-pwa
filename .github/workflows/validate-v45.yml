name: Validate v4.5 admin page
on:
  push:
    paths:
      - '.github/workflows/validate-v45.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate v4.5
        run: |
          node --check app.js
          node --check sw.js
          python - <<'PY'
          from pathlib import Path
          import re
          h=Path('index.html').read_text(encoding='utf-8')
          a=Path('app.js').read_text(encoding='utf-8')
          v=Path('version.js').read_text(encoding='utf-8')
          ids=re.findall(r'\bid="([^"]+)"',h)
          dup=sorted({x for x in ids if ids.count(x)>1})
          if dup: raise SystemExit('duplicate ids: '+','.join(dup))
          checks={
            'version': "APP_VERSION='4.5.0'" in v and 'v4.5.0' in h,
            'admin view': 'id="view-admin" data-view="admin"' in h,
            'admin top button': 'data-nav="admin"' in h and 'admin-top-btn' in h,
            'six views': len(re.findall(r'<section class="view[^"]*" id="view-',h))==6,
            'admin tools unique': all(h.count(f'id="{x}"')==1 for x in ['manageClassesBtn','backupBtn','restoreBtn','recoveryScanBtn','dbDiagnosticBtn','attendanceReferenceCsvBtn']),
            'dashboard clean': h.index('id="view-admin"')>h.index('id="view-dashboard"') and 'dashboard-settings' not in h[h.index('id="view-dashboard"'):h.index('id="view-admin"')],
            'admin nav allowed': "['dashboard','admin','assessments','attendance','schedule','reports']" in a,
            'admin query allowed': "['dashboard','admin','assessments','attendance','schedule','reports'].includes(q)" in a,
            'admin version ui': "$('#adminVersion')" in a,
            'diagnostic retained': 'function runAttendanceDatabaseDiagnostic' in a,
          }
          bad=[k for k,val in checks.items() if not val]
          if bad: raise SystemExit('failed: '+', '.join(bad))
          print('v4.5 admin page validation passed')
          PY
