name: Validate v4.3.2 attendance recovery
on:
  push:
    paths:
      - '.github/workflows/validate-v432.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate v4.3.2
        run: |
          node --check app.js
          node --check sw.js
          python - <<'PY'
          from pathlib import Path
          a=Path('app.js').read_text(encoding='utf-8')
          h=Path('index.html').read_text(encoding='utf-8')
          v=Path('version.js').read_text(encoding='utf-8')
          checks={
            'version': "APP_VERSION='4.3.2'" in v and 'v4.3.2' in h,
            'indexed fallback': 'async getIndexed(k)' in a and 'if(indexed!==undefined&&indexed!==null)return indexed' in a,
            'local candidates': 'function localAttendanceCandidates' in a,
            'merge attendance': 'function mergeAttendanceFromSource' in a,
            'auto recovery': 'recoverAttendanceFromLocalSources({silent:true})' in a,
            'snapshots': 'student-roster-attendance-snapshot-1' in a and 'persistAttendanceSnapshot(previous)' in a,
            'mirror': 'student-roster-attendance-mirror' in a,
            'file recovery': 'function restoreAttendanceOnly' in a and 'attendanceRecoveryInput' in h,
            'diagnostic panel': 'storageRecoveryStatus' in h and 'recoveryScanBtn' in h,
          }
          bad=[k for k,val in checks.items() if not val]
          if bad: raise SystemExit('failed: '+', '.join(bad))
          print('v4.3.2 validation passed')
          PY
