name: Validate v4.12 settings
on:
  push:
    paths:
      - '.github/workflows/validate-v412.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate v4.12 settings
        run: |
          node --check app.js
          node --check sw.js
          python - <<'PY'
          from pathlib import Path
          import re
          h=Path('index.html').read_text(encoding='utf-8')
          a=Path('app.js').read_text(encoding='utf-8')
          v=Path('version.js').read_text(encoding='utf-8')
          ids=re.findall(r'\bid="([^"]+)"',h)
          dup=sorted({x for x in ids if ids.count(x)>1})
          if dup: raise SystemExit('duplicate ids: '+','.join(dup))
          checks={
            'version': "APP_VERSION='4.12.0'" in v and 'v4.12.0' in h,
            'admin schedule selector': 'id="scheduleSettingsSelect"' in h,
            'schedule settings moved': h.index('id="scheduleSettingsSelect"') < h.index('id="view-assessments"'),
            'schedule screen compact': 'class="schedule-meta no-print"' not in h,
            'profile fields': all(x in h for x in ['data-app-meta="teacher"','data-app-meta="school"','data-app-meta="region"','data-app-meta="year"','data-app-meta="principal"']),
            'schedule fields': all(x in h for x in ['scheduleTitleInput','scheduleSemesterInput','scheduleStartInput','scheduleEndInput']),
            'advanced settings collapsed': 'class="panel admin-advanced-details no-print"' in h,
            'render schedule no old inputs': "scheduleTeacherInput" not in a and "scheduleSchoolInput" not in a,
            'schedule selector binding': "settingsSelect.onchange=()=>selectTeacherSchedule" in a,
            'global profile sync': "(state.teacherSchedules||[]).forEach" in a and "renderScheduleHeader()" in a,
          }
          bad=[k for k,val in checks.items() if not val]
          if bad: raise SystemExit('failed: '+', '.join(bad))
          print('v4.12 settings validation passed')
          PY
