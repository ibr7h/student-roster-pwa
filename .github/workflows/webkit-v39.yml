name: WebKit iPhone-sized PWA smoke
on:
  push:
    branches:
      - feature/school-v3.9-unified-auth-20261020
      - test/school-v39-menu-regression-nested-r16-20261026
    paths:
      - scripts/webkit-smoke-v39.mjs
      - scripts/auth-ui-v39.js
      - scripts/release-ui-v39.js
      - scripts/release-ui-v39.css
      - scripts/auth-ui-v39.css
      - scripts/evidence-workspace-v36.js
      - scripts/static-frontend-v37.mjs
      - scripts/harden-report-v39.mjs
      - scripts/mobile-native-v38.js
      - scripts/mobile-native-v38.css
      - scripts/apply-auth-ui-v39.mjs
      - .github/workflows/webkit-v39.yml
permissions:
  contents: read
jobs:
  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: {image: 'mcr.microsoft.com/playwright:v1.58.2-noble'}
    steps:
      - uses: actions/checkout@v4
      - name: Install unzip
        run: apt-get update -qq && apt-get install -y -qq unzip
      - name: Assemble exact v3.9 static preview
        run: |
          unzip -q -o site.zip -d public
          node -e "const fs=require('node:fs'),z=require('node:zlib');fs.writeFileSync('school-backend.tar',z.brotliDecompressSync(Buffer.from(fs.readFileSync('backend-package.b64','utf8').trim(),'base64')))"
          tar -xf school-backend.tar
          node patch-release.mjs
          node scripts/static-frontend-v37.mjs
      - name: Install WebKit runtime
        run: |
          mkdir -p .ci-playwright
          printf '{"name":"isolated-webkit-test","private":true}' > .ci-playwright/package.json
          npm install --prefix .ci-playwright --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright-core@1.58.2
          mkdir -p node_modules
          ln -s ../.ci-playwright/node_modules/playwright-core node_modules/playwright-core
      - name: Check Arabic PWA keyboard and 320/390 WebKit layout
        run: node scripts/webkit-smoke-v39.mjs
