name: Validate v3.10.1 print fix
on:
  push:
    paths:
      - '.github/workflows/validate-print-v3101.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate print fix and versioning
        run: |
          node --check app.js
          node --check sw.js
          grep -q "APP_VERSION='3.10.1'" version.js
          grep -q "\$('#printAttendanceReportBtn').onclick=printAttendanceReport" app.js
          grep -q "function printAttendanceReport(){setPrintPage('portrait')" app.js
          grep -q "try{window.print()}" app.js
          grep -q "version.js" index.html
          grep -q "version.js" sw.js
          echo "v3.10.1 validation passed"
