name: Validate v4.9 multi schedules
on:
  push:
    paths:
      - '.github/workflows/validate-v49.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate v4.9 schedules
        run: |
          node --check app.js
          node --check sw.js
          python - <<'PY'
          from pathlib import Path
          import re
          h=Path('index.html').read_text(encoding='utf-8')
          a=Path('app.js').read_text(encoding='utf-8')
          v=Path('version.js').read_text(encoding='utf-8')
          ids=re.findall(r'\bid="([^"]+)"',h)
          dup=sorted({x for x in ids if ids.count(x)>1})
          if dup: raise SystemExit('duplicate ids: '+','.join(dup))
          checks={
            'version': "APP_VERSION='4.9.0'" in v and 'v4.9.0' in h,
            'schema': 'const SCHEMA_VERSION=4' in a,
            'schedule array': 'teacherSchedules:[initialTeacherSchedule]' in a and 'activeScheduleId:initialTeacherSchedule.id' in a,
            'legacy migration': 'if(!Array.isArray(x.teacherSchedules)||!x.teacherSchedules.length)' in a and 'delete x.teacherSchedule' in a,
            'no old runtime ref': re.search(r'state\.teacherSchedule(?!s)',a) is None,
            'date-aware schedule': 'function scheduleForDate' in a and 'schedule=scheduleForDate(iso)' in a,
            'create schedule': 'function saveNewTeacherSchedule' in a,
            'copy schedule': "mode==='copy'" in a and 'clone(source.slots||{})' in a,
            'activate schedule': 'function setActiveTeacherSchedule' in a,
            'archive schedule': 'function toggleArchiveTeacherSchedule' in a,
            'schedule switch': 'function selectTeacherSchedule' in a,
            'validity fields': all(x in h for x in ['scheduleStartInput','scheduleEndInput','newScheduleStart','newScheduleEnd']),
            'manager controls': all(x in h for x in ['addScheduleBtn','duplicateScheduleBtn','activateScheduleBtn','archiveScheduleBtn','scheduleTabs']),
          }
          bad=[k for k,val in checks.items() if not val]
          if bad: raise SystemExit('failed: '+', '.join(bad))
          print('v4.9 multi-schedule validation passed with migration persistence')
          PY
