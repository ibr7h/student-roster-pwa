name: Inspect mobile UX integration points without any school data
on:
  push:
    branches: [fix/school-v39-mobile-connectivity-ux-r17-20261026]
    paths: [scripts/inspect-mobile-ux-r17.mjs,.github/workflows/inspect-mobile-ux-r17.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build preview without production access
        run: |
          unzip -q -o site.zip -d public
          node -e "const fs=require('node:fs'),z=require('node:zlib');fs.writeFileSync('school-backend.tar',z.brotliDecompressSync(Buffer.from(fs.readFileSync('backend-package.b64','utf8').trim(),'base64')))"
          tar -xf school-backend.tar
          node patch-release.mjs
          node scripts/static-frontend-v37.mjs
      - name: Identify controls and no-data UX state
        run: node scripts/inspect-mobile-ux-r17.mjs
