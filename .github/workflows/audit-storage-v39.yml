name: Audit v3.9 bundled storage interface
on:
  push:
    branches:
      - feature/school-v3.9-unified-auth-20261020
    paths:
      - .github/workflows/audit-storage-v39.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect archived backend storage exports without credentials
        run: |
          node -e "const f=require('fs'),z=require('zlib');f.writeFileSync('current.tar',z.brotliDecompressSync(Buffer.from(f.readFileSync('backend-package.b64','utf8').trim(),'base64')))"
          tar -xf current.tar
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for(const file of ['backend/storage.mjs','backend/server.mjs']){
            const source=fs.readFileSync(file,'utf8');
            const matches=source.split('\n').filter(line=>file.includes('storage.mjs')?/^export |^import /.test(line):/import .*storage|downloadEvidence|uploadEvidence/.test(line));
            console.log('\n=== '+file+' ===\n'+matches.slice(0,65).join('\n'));
          }
          NODE
