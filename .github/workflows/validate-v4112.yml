name: Validate v4.11.2 schedule delete
on:
  push:
    paths:
      - '.github/workflows/validate-v4112.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate schedule deletion
        run: |
          node --check app.js
          node --check sw.js
          python - <<'PY'
          from pathlib import Path
          import re
          h=Path('index.html').read_text(encoding='utf-8')
          a=Path('app.js').read_text(encoding='utf-8')
          v=Path('version.js').read_text(encoding='utf-8')
          ids=re.findall(r'\bid="([^"]+)"',h)
          dup=sorted({x for x in ids if ids.count(x)>1})
          if dup: raise SystemExit('duplicate ids: '+','.join(dup))
          checks={
            'version': "APP_VERSION='4.11.2'" in v and 'v4.11.2' in h,
            'delete button': 'id="deleteScheduleBtn"' in h,
            'delete function': 'function deleteTeacherSchedule' in a,
            'protect active': "t.id===state.activeScheduleId" in a and "عيّن جدولًا آخر نشطًا" in a,
            'protect last': "list.length<=1" in a and "لا يمكن حذف آخر جدول" in a,
            'history warning': 'function scheduleAttendanceUsageDates' in a and 'يُفضّل أرشفته بدل الحذف' in a,
            'preserve attendance': "state.teacherSchedules=list.filter" in a and 'st.attendance' in a,
            'binding': "$('#deleteScheduleBtn').onclick=deleteTeacherSchedule" in a,
          }
          bad=[k for k,val in checks.items() if not val]
          if bad: raise SystemExit('failed: '+', '.join(bad))
          print('v4.11.2 schedule deletion validation passed')
          PY
